# Despliegue del MVP web en Render (https://render.com), plan gratuito.
# La base de datos vive en Neon; sus datos de conexión se cargan como variables
# de entorno en el panel de Render (no se guardan en el repositorio).
services:
  - type: web
    name: skynest
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: PGSSLMODE
        value: require
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        value: neondb
      - key: PGHOST
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
